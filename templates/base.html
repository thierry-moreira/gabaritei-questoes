<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <script nonce="{{ csp_nonce() }}">
        const tema_salvo = localStorage.getItem('theme');

        // Injetamos a cor na raiz do HTML antes da tela ser desenhada
        if (tema_salvo === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            document.documentElement.style.backgroundColor = '#121212';
            document.documentElement.style.color = '#e0e0e0';
        } else {
            document.documentElement.setAttribute('data-bs-theme', 'light');
            document.documentElement.style.backgroundColor = '#f8f9fa';
            document.documentElement.style.color = '#212529';
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Sistema de Questões{% endblock %}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='icone.webp') }}?v=1.1">
    <link rel="icon" href="{{ url_for('static', filename='icone.webp') }}?v=1.1" type="image/webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Variáveis de Cores para facilitar a troca */
        :root {
            --bg-body: #f8f9fa;
            --text-color: #212529;
            --nav-bg: #1a237e;
            /* Azul Marinho Profundo para Admin */
        }

        [data-bs-theme="dark"] {
            --bg-body: #121212;
            --text-color: #e0e0e0;
            --nav-bg: #0d1117;
            /* Nav mais escura no modo dark */
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .navbar-custom {
            background-color: var(--nav-bg) !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .navbar {
            margin-bottom: 30px;
        }

        /* Estilo do botão de Tema */
        .theme-toggle {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .navbar-logo-base {
            height: 60px;
        }

        @media (max-width: 576px) {
            .navbar-logo-base {
                height: 40px;
            }

            .navbar {
                margin-bottom: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        nonce="{{ csp_nonce() }}"></script>
    <script nonce="{{ csp_nonce() }}">
        window.protectCurrencyKaTeX = function (element) {
            if (!element) return;
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            const nodesToReplace = [];
            let node;
            const currencyRegex = /(R\$|U\$|US\$|\$\s+(?=\d))/g;
            
            while (node = walker.nextNode()) {
                if (currencyRegex.test(node.nodeValue)) {
                    nodesToReplace.push(node);
                }
                currencyRegex.lastIndex = 0;
            }
            
            nodesToReplace.forEach(n => {
                if (n.parentNode && !['SCRIPT', 'STYLE', 'CODE', 'SPAN'].includes(n.parentNode.nodeName)) {
                    let match;
                    let lastIndex = 0;
                    const frag = document.createDocumentFragment();
                    let replaced = false;
                    
                    while ((match = currencyRegex.exec(n.nodeValue)) !== null) {
                        replaced = true;
                        if (match.index > lastIndex) {
                            frag.appendChild(document.createTextNode(n.nodeValue.substring(lastIndex, match.index)));
                        }
                        const span = document.createElement('span');
                        span.textContent = match[0];
                        frag.appendChild(span);
                        lastIndex = currencyRegex.lastIndex;
                    }
                    
                    if (replaced) {
                        if (lastIndex < n.nodeValue.length) {
                            frag.appendChild(document.createTextNode(n.nodeValue.substring(lastIndex)));
                        }
                        n.parentNode.replaceChild(frag, n);
                    }
                }
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Proteção para R$ e $ (Moeda) - Evita que o KaTeX confunda com fórmulas
            window.protectCurrencyKaTeX(document.body);

            renderMathInElement(document.body, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false,
                strict: "ignore"
            });
        });
    </script>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script nonce="{{ csp_nonce() }}">
        // 🚀 Lógica atualizada para usar documentElement e limpar o CSS inline
        function toggleTheme() {
            const htmlTag = document.documentElement;
            const btn = document.getElementById('themeBtn');

            if (htmlTag.getAttribute('data-bs-theme') === 'light') {
                htmlTag.setAttribute('data-bs-theme', 'dark');
                htmlTag.style.backgroundColor = ''; // Remove a cor travada
                htmlTag.style.color = '';
                btn.innerHTML = '☀️ Modo Claro';
                localStorage.setItem('theme', 'dark');
            } else {
                htmlTag.setAttribute('data-bs-theme', 'light');
                htmlTag.style.backgroundColor = '';
                htmlTag.style.color = '';
                btn.innerHTML = '🌙 Modo Escuro';
                localStorage.setItem('theme', 'light');
            }
        }

        // Delegação de evento: captura cliques no #themeBtn mesmo após o KaTeX
        // recriar o DOM via innerHTML (que destrói listeners individuais)
        document.addEventListener('click', (e) => {
            if (e.target.closest('#themeBtn')) {
                toggleTheme();
            }
        });

        // Apenas ajusta o texto do botão quando a página terminar de carregar
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const btn = document.getElementById('themeBtn');

            if (savedTheme === 'dark' && btn) {
                btn.innerHTML = '☀️ Modo Claro';
            }

            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

            if (csrfToken) {
                const originalFetch = window.fetch;

                window.fetch = async function () {
                    let [resource, config] = arguments;
                    if (config === undefined) config = {};
                    if (config.headers === undefined) config.headers = {};

                    if (config.method && ['POST', 'PUT', 'DELETE'].includes(config.method.toUpperCase())) {
                        config.headers['X-CSRFToken'] = csrfToken;
                    }

                    return originalFetch(resource, config);
                };
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
